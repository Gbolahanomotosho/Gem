services:
  - type: web
    name: gem-ai
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: PORT
        value: 10000
      - key: DEBUG
        value: False
      # Add your AI provider API key here in Render dashboard
      # Example: GEMINI_API_KEY, GROQ_API_KEY, etc.
