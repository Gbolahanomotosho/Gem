<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem 💎 AI - World's Most Advanced Grading System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --dark: #0d0d0d;
            --light: #ffffff;
            --gray: #f8f9fa;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #17a2b8;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(-45deg, #0d0d0d, #1a1a1a, #2d1b69, #11998e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 0;
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 2rem;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: var(--light);
        }

        .btn-secondary {
            background: transparent;
            color: var(--light);
            border: 2px solid var(--primary);
        }

        .upload-section {
            padding: 6rem 2rem;
        }

        .upload-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 20px;
            padding: 4rem 2rem;
            cursor: pointer;
            margin: 2rem 0;
            background: rgba(102, 126, 234, 0.05);
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .grading-form {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--light);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .results-section {
            display: none;
            padding: 2rem 0;
        }

        .results-section.active {
            display: block;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 2rem;
            margin: 1rem 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    
    <nav id="navbar">
        <div class="nav-container">
            <div class="logo">💎 Gem AI</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#upload">Try Now</a></li>
            </ul>
        </div>
    </nav>

    <section id="home" class="hero">
        <div>
            <h1>Gem 💎 AI</h1>
            <p class="subtitle">World's Most Advanced Exam Grading System</p>
            <a href="#upload" class="btn btn-primary">
                <i class="fas fa-rocket"></i>
                Start Grading
            </a>
        </div>
    </section>

    <section id="upload" class="upload-section">
        <div class="upload-container">
            <h2 style="text-align: center; font-size: 2.5rem; margin-bottom: 2rem;">Try Gem AI Now</h2>
            
            <div class="upload-area" id="uploadArea">
                <div style="text-align: center;">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 4rem; color: var(--primary);"></i>
                    <h3>Drop your files here or click to browse</h3>
                    <p>Supports: PDF, DOCX, TXT, JPG, PNG</p>
                </div>
                <input type="file" id="fileInput" multiple accept="*" style="display: none;">
            </div>
            
            <div class="grading-form">
                <h3>Grading Configuration</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="examName">Exam Name</label>
                        <input type="text" id="examName" placeholder="e.g., Biology Final Exam" value="Biology Final Exam">
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="e.g., Biology" value="Biology">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="totalPoints">Total Points</label>
                        <input type="number" id="totalPoints" value="100" min="1">
                    </div>
                    <div class="form-group">
                        <label for="questionNumber">Question Number</label>
                        <input type="number" id="questionNumber" value="1" min="1">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="modelAnswer">Model Answer</label>
                    <textarea id="modelAnswer" rows="4" placeholder="Enter the correct answer...">Photosynthesis is the process by which green plants and some other organisms use sunlight to synthesize nutrients from carbon dioxide and water.</textarea>
                </div>
                
                <div class="form-group">
                    <button class="btn btn-primary" id="gradeBtn" onclick="startGrading()" style="width: 100%;">
                        <i class="fas fa-magic"></i>
                        Grade with AI
                    </button>
                </div>
            </div>
            
            <div class="results-section" id="resultsSection">
                <h3>Grading Results</h3>
                <div id="resultsContainer"></div>
            </div>
        </div>
    </section>

    <div class="loading-overlay" id="loadingOverlay">
        <div style="text-align: center;">
            <div class="loading-spinner"></div>
            <p style="margin-top: 1rem; font-size: 1.2rem;">AI is grading your exams...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        let selectedFiles = [];

        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#28a745';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });

        function handleFiles(files) {
            selectedFiles = files;
            if (files.length > 0) {
                uploadArea.querySelector('h3').textContent = `${files.length} file(s) selected ✓`;
                uploadArea.style.borderColor = '#28a745';
            }
        }

        async function startGrading() {
            const examName = document.getElementById('examName').value;
            const subject = document.getElementById('subject').value;
            const totalPoints = document.getElementById('totalPoints').value;
            const modelAnswer = document.getElementById('modelAnswer').value;

            if (!selectedFiles.length) {
                alert('Please select files to grade');
                return;
            }

            if (!examName || !subject || !modelAnswer) {
                alert('Please fill in all required fields');
                return;
            }

            document.getElementById('loadingOverlay').classList.add('active');

            try {
                await simulateGrading();
                displayResults();
            } catch (error) {
                alert('Grading failed. Please try again.');
                console.error(error);
            } finally {
                document.getElementById('loadingOverlay').classList.remove('active');
            }
        }

        async function simulateGrading() {
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            window.gradingResults = selectedFiles.map((file, index) => ({
                filename: file.name,
                studentName: `Student ${index + 1}`,
                studentId: `ST${String(index + 1).padStart(3, '0')}`,
                score: Math.floor(Math.random() * 40) + 60,
                totalPoints: parseInt(document.getElementById('totalPoints').value),
                grade: ['A+', 'A', 'B+', 'B', 'C+', 'C'][Math.floor(Math.random() * 6)],
                percentage: Math.floor(Math.random() * 40) + 60,
                feedback: "Excellent understanding of the topic. Well-structured answer with clear explanations.",
                strengths: ["Clear explanations", "Good examples", "Logical structure"],
                improvements: ["Add more detail", "Include diagrams"],
                student_info: {
                    name: `Student ${index + 1}`,
                    student_id: `ST${String(index + 1).padStart(3, '0')}`,
                    exam_name: document.getElementById('examName').value,
                    subject: document.getElementById('subject').value
                }
            }));
        }

        function displayResults() {
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsSection = document.getElementById('resultsSection');
            
            resultsContainer.innerHTML = '';
            
            const summaryCard = document.createElement('div');
            summaryCard.className = 'result-card';
            summaryCard.style.borderLeft = '4px solid #667eea';
            summaryCard.innerHTML = `
                <h4><i class="fas fa-chart-bar"></i> Grading Summary</h4>
                <p style="margin: 1rem 0;">Total Students: ${window.gradingResults.length}</p>
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="downloadAllResults()">
                        <i class="fas fa-file-pdf"></i> Download Full Report
                    </button>
                </div>
            `;
            resultsContainer.appendChild(summaryCard);
            
            window.gradingResults.forEach((result, index) => {
                const resultCard = document.createElement('div');
                resultCard.className = 'result-card';
                resultCard.innerHTML = `
                    <div>
                        <h4>${result.studentName} (${result.studentId})</h4>
                        <p style="opacity: 0.8;">${result.filename}</p>
                    </div>
                    
                    <p style="margin-top: 1rem;"><strong>Score:</strong> ${result.score}/${result.totalPoints} (${result.percentage}%)</p>
                    <p><strong>Grade:</strong> ${result.grade}</p>
                    <p><strong>Feedback:</strong> ${result.feedback}</p>
                    
                    <div style="margin-top: 1rem;">
                        <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;" onclick="downloadResult(${index})">
                            <i class="fas fa-download"></i> Download PDF
                        </button>
                    </div>
                `;
                resultsContainer.appendChild(resultCard);
            });
            
            resultsSection.classList.add('active');
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        async function downloadResult(index) {
            const result = window.gradingResults[index];
            
            try {
                showNotification('Generating PDF report...', 'info');
                
                const response = await fetch('/api/generate-report', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        results: [result],
                        exam_config: {
                            exam_name: document.getElementById('examName').value,
                            subject: document.getElementById('subject').value,
                            rubric: {
                                total_points: parseInt(document.getElementById('totalPoints').value)
                            }
                        }
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const link = document.createElement('a');
                    link.href = `data:application/pdf;base64,${data.pdf_data}`;
                    link.download = `${result.studentName}_${result.studentId}_Report.pdf`;
                    link.click();
                    
                    showNotification('PDF report downloaded successfully!', 'success');
                } else {
                    showNotification('Failed to generate PDF: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error generating PDF:', error);
                showNotification('Error generating PDF report', 'error');
            }
        }

        async function downloadAllResults() {
            try {
                showNotification('Generating complete report...', 'info');
                
                const response = await fetch('/api/generate-report', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        results: window.gradingResults,
                        exam_config: {
                            exam_name: document.getElementById('examName').value,
                            subject: document.getElementById('subject').value,
                            rubric: {
                                total_points: parseInt(document.getElementById('totalPoints').value)
                            }
                        }
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const link = document.createElement('a');
                    link.href = `data:application/pdf;base64,${data.pdf_data}`;
                    link.download = 'Complete_Grading_Report.pdf';
                    link.click();
                    
                    showNotification('Complete report downloaded!', 'success');
                } else {
                    showNotification('Failed to generate report: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error generating report', 'error');
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                background: ${type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#17a2b8'};
                color: white;
                padding: 1rem 2rem;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                z-index: 10001;
                font-weight: 600;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            `;
            notification.innerHTML = `<i class="fas fa-${type === 'success' ? 'check' : type === 'error' ? 'times' : 'info'}-circle"></i> ${message}`;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    if (document.body.contains(notification)) {
                        document.body.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
